<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم ألعاب الأطفال الذكي 2026</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: #ffcc00;
            color: #222;
            padding: 20px;
            border-bottom: 5px solid #ff9900;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 25px;
        }
        .category-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 260px;
            padding: 20px;
            cursor: pointer;
            border: 3px solid #ff66b2;
            transition: 0.3s;
        }
        .category-card:hover {
            transform: scale(1.05);
            background-color: #fff0f5;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 10px;
            border-radius: 15px;
            width: 95%;
            max-width: 900px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            border-radius: 10px;
            background: #fff;
        }
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌟 منصة ألعاب الأطفال الحقيقية 2026 🌟</h1>
        <p>اضغط على أي لعبة لتفتح وتعمل فوراً أمامك!</p>
    </header>

    <main class="container">
        <!-- ألعاب مدمجة بروابط آمنة ومباشرة -->
        <div class="category-card" onclick="playGame('https://g.vseigru.net/7/igra-gonki-po-vertikali/index.html')">
            <div style="font-size: 3rem;">🚗</div>
            <h3>لعبة سباق السيارات</h3>
            <p>انطلق بأقصى سرعة وتجاوز التحديات</p>
        </div>

        <div class="category-card" onclick="playGame('https://g.vseigru.net/13/igra-prigotovlenie-piccy/index.html')">
            <div style="font-size: 3rem;">🍳</div>
            <h3>لعبة الطبخ والوجبات</h3>
            <p>اصنع أشهى الأطباق واكسب النجوم</p>
        </div>

        <div class="category-card" onclick="playGame('https://g.vseigru.net/14/igra-ferma-fermer-dzon/index.html')">
            <div style="font-size: 3rem;">🌾</div>
            <h3>المزرعة والحيوانات</h3>
            <p>ازرع المحاصيل واعتنِ بالحيوانات</p>
        </div>

        <div class="category-card" onclick="playGame('https://g.vseigru.net/12/igra-pazl-dlya-detey/index.html')">
            <div style="font-size: 3rem;">🧩</div>
            <h3>الألغاز والحروف</h3>
            <p>تحدي الذكاء وتطوير المهارات</p>
        </div>
    </main>

    <!-- نافذة تشغيل اللعبة -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <iframe id="gameFrame" src=""></iframe>
            <button class="close-btn" onclick="closeGame()">إغلاق اللعبة والعودة</button>
        </div>
    </div>

    <script>
        function playGame(url) {
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('gameModal').style.display = 'none';
        }
    </script>

</body>
</html>
